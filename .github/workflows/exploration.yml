name: Quiet map exploration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
